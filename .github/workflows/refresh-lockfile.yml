name: Refresh lockfile and audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Only enable npm cache when a package-lock.json actually exists
          # (this project primarily uses pnpm)
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install / refresh lockfile (only if package-lock.json exists)
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found, attempting to refresh..."
            if npm ci; then
              echo "npm ci succeeded"
            else
              echo "npm ci failed, running npm install to regenerate lockfile"
              npm install
            fi
          else
            echo "No package-lock.json present (project uses pnpm). Skipping npm lockfile refresh."
          fi

      - name: Run npm audit (optional)
        run: |
          if [ -f package-lock.json ]; then
            npm audit --audit-level=low || true
          else
            echo "No package-lock.json, skipping npm audit."
          fi

      - name: Commit package-lock.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q package-lock.json; then
            git add package-lock.json
            git commit -m "chore: regenerate package-lock.json (refresh integrity) [skip ci]" || echo "no commit"
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              git push origin HEAD:${{ github.head_ref }} || echo "push failed (permission or no changes)"
            else
              git push || echo "push failed"
            fi
            echo "package-lock.json updated and pushed"
          else
            echo "no changes to package-lock.json"
          fi
